<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" />

  <!-- Open Book Base (Knowledge) -->
  <path d="M120 340 C 180 320, 230 330, 256 350 C 282 330, 332 320, 392 340 L 392 210 C 332 190, 282 200, 256 220 C 230 200, 180 190, 120 210 Z" fill="#ffffff" filter="url(#shadow)" opacity="0.95"/>
  
  <path d="M256 220 L 256 350" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>

  <!-- AI Companion Sparkle / Torch flame (Growth & Guidance) -->
  <path d="M256 120 C 275 155, 305 170, 290 205 C 275 220, 237 220, 222 205 C 207 170, 237 155, 256 120 Z" fill="url(#grad2)" filter="url(#shadow)"/>
  
  <circle cx="256" cy="180" r="14" fill="#ffedd5"/>

  <!-- Connectivity Orbit Ring -->
  <ellipse cx="256" cy="256" rx="200" ry="80" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" transform="rotate(-15 256 256)"/>
</svg>
